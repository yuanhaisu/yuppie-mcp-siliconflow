[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yuppie-siliconflow"
version = "0.1.0"
description = "SiliconFlow API client library (image generation & editing) — no MCP dependency"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "yuppie", email = "yidaowanli@gmail.com" }
]
keywords = ["siliconflow", "flux", "z-image", "qwen-image", "image-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/yuppie1949/yuppie-mcp-siliconflow"
Repository = "https://github.com/yuppie1949/yuppie-mcp-siliconflow"

[tool.hatch.build.targets.wheel]
packages = ["src/yuppie_siliconflow"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/pyproject.toml",
]
